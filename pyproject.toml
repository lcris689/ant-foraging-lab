[project]
name = "ant-foraging-lab"
version = "0.1.0"
description = "Reproducible agent-based experiments in collective ant foraging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "scipy>=1.11,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
ant-foraging-lab-web = "ant_foraging_lab.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
