[project]
name = "ant-foraging-lab"
version = "0.3.0"
description = "Reproducible agent-based experiments in collective ant foraging"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Cris Lizarraga" }]
keywords = ["agent-based-modeling", "simulation", "reproducibility", "collective-behavior"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
ant-foraging-lab-web = "ant_foraging_lab.web:main"
ant-foraging-lab-batch = "ant_foraging_lab.batch_cli:main"

[project.urls]
Homepage = "https://github.com/lcris689/ant-foraging-lab"
Repository = "https://github.com/lcris689/ant-foraging-lab"
Documentation = "https://github.com/lcris689/ant-foraging-lab#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "/.git",
  "/.hermes",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/dist",
  "/results",
  "**/__pycache__",
  "**/*.pyc",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/AGENTS.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ant_foraging_lab"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "ruff>=0.17,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
